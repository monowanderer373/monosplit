name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  production-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify notifications with the production module graph
        run: npx playwright test --config=playwright.production-ui.config.ts --workers=2

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run lint
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: set -o pipefail; npx supabase db lint --fail-on warning 2>&1 | tee /tmp/tabby-db-lint.log
      - run: set -o pipefail; npx supabase test db 2>&1 | tee /tmp/tabby-db-tests.log
      - if: always()
        run: python3 scripts/report-database-results.py
      - if: failure()
        run: python3 scripts/report-database-failure.py
      - name: Verify collect/pay write exclusion with two sessions
        env:
          COLLECT_PAY_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python3 supabase/tests/collect_pay_lock_concurrency.py
      - name: Verify atomic multicurrency funding with competing sessions
        env:
          MULTICURRENCY_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python3 supabase/tests/multicurrency_concurrency.py
      - name: Verify Fresh Start concurrency and interrupted-request fencing
        env:
          PERSONAL_PERIOD_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python3 supabase/tests/personal_period_concurrency.py
      - name: Verify full shared Reset concurrency and replay
        env:
          SHARED_RESTART_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python3 supabase/tests/shared_restart_concurrency.py
      - name: Verify directed friend requests with competing authenticated sessions
        env:
          TRIP_FRIEND_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python3 supabase/tests/trip_friend_concurrency.py
      - if: always()
        run: npx supabase stop --no-backup

  historical-database-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - run: npx supabase start
      - name: Reconstruct schema before legacy lockdown
        run: |
          npx supabase db reset --local --version 202608300006
          for attempt in {1..30}; do
            pg_isready -d "$LOCAL_DATABASE_URL" && break
            sleep 2
          done
          pg_isready -d "$LOCAL_DATABASE_URL"
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/fixtures/legacy_pre_007.sql
      - name: Apply release, hardening, and archive migrations
        run: |
          exec > >(tee /tmp/tabby-history-apply.log) 2>&1
          python3 scripts/generate-multicurrency-apply.py
          python3 scripts/generate-personal-periods-apply.py
          python3 scripts/generate-personal-confirmation-apply.py
          python3 scripts/generate-shared-restart-apply.py
          python3 scripts/generate-trip-friends-apply.py
          git diff --exit-code -- docs/runbooks/multicurrency-production-apply.sql docs/runbooks/personal-periods-production-apply.sql docs/runbooks/personal-confirmation-production-apply.sql docs/runbooks/shared-restart-production-apply.sql
          mkdir /tmp/tabby-multicurrency-migrations
          mv supabase/migrations/20261016130602_multicurrency_accounts_and_funding.sql supabase/migrations/20261016132156_multicurrency_money_movements.sql supabase/migrations/202610250001_personal_ledger_periods.sql supabase/migrations/202610250002_personal_period_opening_safety.sql supabase/migrations/202610250003_personal_period_session_confirmation.sql supabase/migrations/202610260001_shared_restart.sql supabase/migrations/202610280001_trip_friend_requests.sql /tmp/tabby-multicurrency-migrations/
          trap 'mv /tmp/tabby-multicurrency-migrations/*.sql supabase/migrations/' EXIT
          npx supabase migration up --local
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/multicurrency-production-apply.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/multicurrency-production-apply.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/personal-periods-production-apply.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/personal-periods-production-apply.sql
          python3 scripts/verify-personal-confirmation-transport.py --migration-file /tmp/tabby-multicurrency-migrations/202610250003_personal_period_session_confirmation.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/personal-confirmation-production-apply.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/personal-confirmation-production-apply.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/shared-restart-production-apply.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/shared-restart-production-apply.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/trip-friends-production-apply.sql
          psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/runbooks/trip-friends-production-apply.sql
      - if: failure()
        run: python3 scripts/report-database-failure.py
      - name: Assert historical lockdown, normalization, and archive
        run: psql "$LOCAL_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/fixtures/legacy_post_009_assertions.sql
      - run: npx supabase db lint --local --fail-on warning
      - if: always()
        run: npx supabase stop --no-backup

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx playwright install --with-deps chromium
      - name: Build and serve approved homepage baseline
        env:
          VITE_HOME_VISUAL: '1'
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: |
          git worktree add --detach ../collect-pay-baseline b36045d273ba86d42cb7cb4950ea2f2bc5cdede3
          ln -s "$GITHUB_WORKSPACE/node_modules" ../collect-pay-baseline/node_modules
          cd ../collect-pay-baseline
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 5174 >/tmp/collect-pay-baseline-preview.log 2>&1 &
      - run: npm run test:e2e
        env:
          COLLECT_PAY_BASELINE_URL: http://127.0.0.1:5174
      - name: Report final browser failures without stdout or auth state
        if: failure()
        run: node scripts/report-browser-failures.mjs
      - name: Save collect/pay screenshots and DOM measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-pay-browser-evidence
          path: test-results/collect-pay/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save browser assertions and failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-browser-results
          path: |
            test-results/browser-results.json
            test-results/notifications/
            test-results/notifications-a/
            test-results/**/error-context.md
            test-results/insights-ui/
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: npx supabase stop --no-backup

  collect-pay-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx playwright install --with-deps chromium
      - name: Build and serve approved homepage baseline
        env:
          VITE_HOME_VISUAL: '1'
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
        run: |
          git worktree add --detach ../collect-pay-baseline b36045d273ba86d42cb7cb4950ea2f2bc5cdede3
          ln -s "$GITHUB_WORKSPACE/node_modules" ../collect-pay-baseline/node_modules
          cd ../collect-pay-baseline
          npm run build
          nohup npm run preview -- --host 127.0.0.1 --port 5174 >/tmp/collect-pay-baseline-preview.log 2>&1 &
      - run: npx playwright test e2e/collect-pay.spec.ts e2e/collect-pay-geometry.spec.ts
        env:
          COLLECT_PAY_BASELINE_URL: http://127.0.0.1:5174
      - name: Save collect/pay screenshots and DOM measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-pay-release-evidence
          path: test-results/collect-pay/
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: npx supabase stop --no-backup

  travel-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/travel.spec.ts e2e/inline-quick-add.spec.ts e2e/trip-period.spec.ts --workers=1
      - name: Save real Travel screenshots and DOM measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-browser-evidence
          path: |
            test-results/travel/
            test-results/inline-quick-add/
            test-results/trip-period/
            test-results/browser-results.json
            test-results/**/error-context.md
            test-results/insights-ui/
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: npx supabase stop --no-backup
